<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolarisPro Parts Yard</title>

  <style>
    body {
      margin: 0;
      background-color: #111;
      color: white;
      text-align: center;

    .hero {
      padding: 100px 20px 60px;
    }

      font-size: 42px;
      margin-bottom: 25px;
    }

      margin-bottom: 35px;

      padding: 30px 20px;

      margin-bottom: 30px;

      font-size: 22px;
      margin: 25px 0;

      padding: 60px 20px;

  <section class="parts" id="parts">

    <div class="part">Polaris Ranger Parts</div>

  <section class="contact">

    <a
      class="button"
